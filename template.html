<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZZZ Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Colores de rango del juego: S dorado, A morado, B azul. */
:root{--bg:#0b0b0c;--card:#151517;--soft:#1e1e21;--line:#26262a;--ink:#f2f2f2;--ink2:#b9b9be;--mut:#7a7a81;
  --s:#ffb21e;--s2:#9c6a0a;--a:#b55cff;--b:#3399ff;--cur:#4a4a50;--av:min(56px,6vh);--top:calc(var(--av) + 24px);--lbl:44px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:15px/1.35 Barlow,system-ui,sans-serif}
.app{height:100vh;display:grid;grid-template-rows:auto 1.2fr 1fr;gap:16px;padding:20px 24px}
header{display:flex;align-items:center;gap:40px}
h1{margin:0;font:700 30px/1 "Barlow Condensed",sans-serif;letter-spacing:.01em}
.sub{color:var(--mut);font-size:13px;margin-top:4px}
.kpis{display:flex;gap:36px;margin-left:auto}
.k b{display:block;font:700 32px/1 "Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums}
.k b.s{color:var(--s)}.k span{color:var(--mut);font-size:13px}
.btns{display:flex;flex-direction:column;gap:8px;align-items:flex-end}
select,button{background:var(--soft);border:0;color:var(--ink2);border-radius:6px;padding:7px 12px;font:inherit;font-size:13px;cursor:pointer}
select{margin-right:8px}button:hover,select:hover{background:var(--line)}
button.go{background:var(--ink);color:var(--bg);font-weight:600}button.go:hover{background:#fff}button:disabled{opacity:.6;cursor:wait}
.msg{position:absolute;top:84px;right:24px;font-size:13px;color:var(--ink2)}
.row{display:flex;gap:16px;min-height:0}
.card{background:var(--card);border-radius:10px;padding:16px 18px 10px;display:flex;flex-direction:column;min-width:0;min-height:0}
.side{width:300px;flex:none}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:16px}
h2{margin:0;font:700 22px/1 "Barlow Condensed",sans-serif}
.st{display:flex;gap:14px;color:var(--mut);font-size:13px;white-space:nowrap}.st b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.odds{color:var(--ink2);font-size:13px;margin-top:6px}.odds b{color:var(--ink);font-weight:600}
.lg{display:flex;gap:14px;font-size:12px;color:var(--mut);margin-top:4px}.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.plot{flex:1;min-height:0;display:flex;gap:6px;position:relative;margin-top:6px}
.grid{position:absolute;inset:0;pointer-events:none}
.grid div{position:absolute;left:0;right:0;border-top:1px solid var(--line);color:var(--mut);font-size:11px}
.grid span{position:absolute;right:0;top:-15px}
.col{flex:1 1 0;max-width:86px;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;z-index:1}
.v{font:700 17px/1 "Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums;margin-bottom:5px}
.av{width:min(var(--av),100%);aspect-ratio:1;flex:none;border-radius:50%;background:var(--soft);box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--s);overflow:hidden;display:grid;place-items:center;font-weight:600;font-size:13px;color:var(--mut);margin-bottom:-12px;z-index:2;cursor:default}
.av img{width:100%;height:100%;object-fit:cover}
.lost .av{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--s2)}
.cur .av{box-shadow:inset 0 0 0 2px var(--cur);background:none;font-size:18px}
.bar{width:min(20px,40%);background:var(--s);border-radius:3px 3px 0 0;min-height:12px;display:flex;flex-direction:column-reverse;align-items:center;gap:3px;padding:3px 0 16px;overflow:hidden}
.lost .bar{background:repeating-linear-gradient(135deg,var(--s) 0 5px,var(--s2) 5px 10px)}
.cur .bar{background:repeating-linear-gradient(135deg,var(--cur) 0 3px,transparent 3px 7px)}
.mini{width:16px;height:16px;flex:none;border-radius:50%;background:var(--card);box-shadow:0 0 0 1.5px var(--a);overflow:hidden;font-size:7px;font-weight:600;color:var(--ink2);display:grid;place-items:center;cursor:default}
.mini img{width:100%;height:100%;object-fit:cover}.mini:hover{transform:scale(1.4)}
.more{font:700 11px/1 "Barlow Condensed",sans-serif;color:#1a1204}
.lbl{height:var(--lbl);flex:none;width:100%;text-align:center;font-size:12px;line-height:1.2;padding-top:6px;color:var(--ink2)}
.lbl div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lbl small{display:block;color:var(--mut);font-size:11px}
.sm{--av:min(40px,4.6vh)}.sm .bar{width:min(12px,30%);padding:0}.sm .v{font-size:15px}
.rec{display:flex;flex-direction:column;margin-top:10px;overflow:hidden}
.rec div{display:flex;justify-content:space-between;gap:10px;padding:clamp(4px,.9vh,8px) 0;border-top:1px solid var(--line);font-size:14px}
.rec span{color:var(--mut)}.rec b{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.ranks{display:flex;height:8px;border-radius:2px;overflow:hidden;gap:2px;margin:12px 0 6px}
.rk{display:flex;justify-content:space-between;font-size:13px;color:var(--mut)}.rk b{font:700 20px/1 "Barlow Condensed",sans-serif;margin-right:4px}
.empty{grid-row:2/4;display:grid;place-items:center;color:var(--ink2);font-size:17px}
.tip{position:fixed;pointer-events:none;background:var(--soft);color:var(--ink);padding:10px 12px;border-radius:8px;font-size:13px;display:none;z-index:9;max-width:290px}
.tip b{display:block;font-weight:600;margin-bottom:3px}.tip span{display:block;color:var(--ink2)}
.tip .as{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}.tip .as .mini{width:22px;height:22px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="tip" id="tip"></div>
<script>
const DATA = __HISTORY__;
const TOKEN = '__TOKEN__';
const ACCOUNTS = __ACCOUNTS__;
const ENKA = 'https://raw.githubusercontent.com/EnkaNetwork/API-docs/master/store/zzz/';
// Agentes del canal estándar; su motor-W característico es "14" + id sin el primer dígito.
const STD_AGENTS = ['1021', '1041', '1101', '1141', '1181', '1211'];
const STD = new Set([...STD_AGENTS, ...STD_AGENTS.map(id => '14' + id.slice(1))]);
// Modelo de pity de la comunidad: tasa base, inicio del pity suave, garantía y alza por tirada.
const PITY = {
  agent: {base: .006, soft: 74, hard: 90, step: .06},
  engine: {base: .01, soft: 65, hard: 80, step: .07},
};
const BANNERS = [
  {k: '2', model: 'agent', featured: .5},
  {k: '3', model: 'engine', featured: .75},
  // Estándar y Bangboo se muestran en pequeño; no cuentan en totales ni récords.
  {k: '1', model: 'agent', small: true},
  {k: '5', model: 'engine', small: true},
];
const TXT = {
  es: {
    names: {1: 'Estándar', 2: 'Exclusiva', 3: 'Motor-W', 5: 'Bangboo'},
    since: (d, u) => `Desde ${d}${u ? ' · UID ' + u : ''}`, pulls: 'tiradas', poly: 'polícromos',
    sRank: 'rango S', exAvg: 'pity promedio', fifty: '50/50 ganados', next10: 'S en 10 tiradas', avg: 'prom.',
    featured: 'Destacado', lost: 'Perdido 50/50', aRank: 'Rango A', now: 'Ahora', pity: 'pity',
    odds: (p1, p10, e) => `Siguiente tirada <b>${p1}</b> · en 10 <b>${p10}</b> · S en ~<b>${e}</b>`,
    guar: ' · destacado <b>garantizado</b>',
    tipS: (p, a) => `${p} tiradas · ${a} rango A`, won: '50/50 ganado', lostTip: '50/50 perdido',
    tipNow: (n, h, a) => `${n} de ${h} tiradas sin S · ${a} rango A`, nextTip: p => `Siguiente tirada: ${p}`,
    tipA: n => `Tirada ${n} del pity`,
    rec: 'Récords', sRate: 'Tasa S', aRate: 'Tasa A', perA: 'Tiradas por A',
    fast: 'S más rápido', slow: 'S más lento', most: 'Más repetido',
    month: 'Mes con más tiradas', day: 'Día con más tiradas', lang: 'English',
    update: 'Actualizar historial', updating: 'Descargando…', added: n => n ? `${n} tiradas nuevas` : 'Sin tiradas nuevas',
    errors: {empty: 'Esta cuenta aún no tiene tiradas.', nogame: 'Abre el juego en este PC y entra al historial de señales.', expired: 'Abre el historial de señales en el juego y vuelve a actualizar.', api: 'Sin conexión con HoYoverse. Intenta de nuevo.'},
    empty: 'Abre el historial de señales en el juego y pulsa Actualizar historial.',
  },
  en: {
    names: {1: 'Standard', 2: 'Exclusive', 3: 'W-Engine', 5: 'Bangboo'},
    since: (d, u) => `Since ${d}${u ? ' · UID ' + u : ''}`, pulls: 'pulls', poly: 'polychromes',
    sRank: 'S-rank', exAvg: 'average pity', fifty: '50/50 won', next10: 'S within 10 pulls', avg: 'avg.',
    featured: 'Featured', lost: 'Lost 50/50', aRank: 'A-rank', now: 'Now', pity: 'pity',
    odds: (p1, p10, e) => `Next pull <b>${p1}</b> · within 10 <b>${p10}</b> · S in ~<b>${e}</b>`,
    guar: ' · featured <b>guaranteed</b>',
    tipS: (p, a) => `${p} pulls · ${a} A-rank`, won: '50/50 won', lostTip: '50/50 lost',
    tipNow: (n, h, a) => `${n} of ${h} pulls without S · ${a} A-rank`, nextTip: p => `Next pull: ${p}`,
    tipA: n => `Pull ${n} of the pity`,
    rec: 'Records', sRate: 'S rate', aRate: 'A rate', perA: 'Pulls per A',
    fast: 'Fastest S', slow: 'Slowest S', most: 'Most repeated',
    month: 'Busiest month', day: 'Busiest day', lang: 'Español',
    update: 'Update history', updating: 'Downloading…', added: n => n ? `${n} new pulls` : 'No new pulls',
    errors: {empty: 'This account has no pulls yet.', nogame: 'Open the game on this PC and go to the signal history.', expired: 'Open the signal history in the game and update again.', api: 'Could not reach HoYoverse. Try again.'},
    empty: 'Open the signal history in the game and press Update history.',
  },
};
let lang = 'en', msg = '';
try { lang = (localStorage.getItem('lang') || navigator.language).startsWith('es') ? 'es' : 'en'; } catch {}
const IMG = {}, TIPS = [];

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);
const pct = x => (x * 100).toFixed(x < .1 ? 1 : 0) + '%';
const date = ts => new Date(ts * 1000).toISOString().replace('T', ' ').slice(0, 16);
const nameOf = id => esc(DATA.names[id] || id);
const ini = id => (DATA.names[id] || id).split(/\s+/).map(w => w[0]).join('').slice(0, 2);
const face = id => IMG[id] ? `<img src="${IMG[id]}" alt="" loading="lazy">` : esc(ini(id));
const tip = html => `data-tip="${TIPS.push(html) - 1}"`;
const rate = (m, n) => n >= m.hard ? 1 : Math.min(1, m.base + Math.max(0, n - m.soft + 1) * m.step);
// Altura de una barra: el alto del gráfico menos el retrato de arriba y el nombre de abajo.
const H = (p, h) => `calc((100% - var(--top) - var(--lbl)) * ${Math.min(p, h) / h})`;

function odds(m, pend) {
  let alive = 1, miss10 = 1, expected = 0;
  for (let n = pend + 1; n <= m.hard; n++) {
    const r = rate(m, n);
    if (n <= pend + 10) miss10 *= 1 - r;
    expected += alive;
    alive *= 1 - r;
  }
  return {next: rate(m, pend + 1), within10: 1 - miss10, expected: Math.round(expected)};
}

// Cada fila: [id, item_id, rango (4=S, 3=A, 2=B), unix].
function stats(b) {
  const rows = DATA.pulls[b.k] || [], s = [];
  let run = [];
  const aOf = run => run.flatMap((r, i) => r[2] === 3 ? [{item: String(r[1]), n: i + 1, ts: r[3]}] : []);
  for (const r of rows) {
    run.push(r);
    if (r[2] === 4) {
      s.push({item: String(r[1]), ts: r[3], p: run.length, a: aOf(run), std: !!b.featured && STD.has(String(r[1]))});
      run = [];
    }
  }
  const m = PITY[b.model];
  return {...b, m, rows, s, pend: run.length, pendA: aOf(run),
    aCount: rows.filter(r => r[2] === 3).length,
    avg: s.length ? (s.reduce((a, r) => a + r.p, 0) / s.length).toFixed(1) : '—',
    odds: odds(m, run.length), guaranteed: !!(b.featured && s.length && s[s.length - 1].std)};
}

function minis(list, t) {
  return list.map(a => `<div class="mini" ${tip(`<b>${nameOf(a.item)}</b><span>${t.tipA(a.n)}</span><span>${date(a.ts)}</span>`)}>${face(a.item)}</div>`).join('');
}

function card(x, t, cls = '') {
  const h = x.m.hard, small = !!x.small;
  const aList = a => a.length ? `<div class="as">${a.map(r => `<div class="mini">${face(r.item)}</div>`).join('')}</div>` : '';
  const cols = x.s.map(r => `<div class="col${r.std ? ' lost' : ''}">
      <div class="v">${r.p}</div>
      <div class="av" ${tip(`<b>${nameOf(r.item)}</b><span>${date(r.ts)}</span><span>${t.tipS(r.p, r.a.length)}</span>${x.featured ? `<span>${r.std ? t.lostTip : t.won}</span>` : ''}${aList(r.a)}`)}>${face(r.item)}</div>
      <div class="bar" style="height:${H(r.p, h)}">${small ? '' : minis(r.a, t)}</div>
      <div class="lbl"><div>${nameOf(r.item)}</div><small>${date(r.ts).slice(5, 10).replace('-', '/')}</small></div></div>`).join('');
  const now = `<div class="col cur"><div class="v">${x.pend}</div>
      <div class="av" ${tip(`<b>${t.now}</b><span>${t.tipNow(x.pend, h, x.pendA.length)}</span><span>${t.nextTip(pct(x.odds.next))}</span>${aList(x.pendA)}`)}>?</div>
      <div class="bar" style="height:${H(x.pend, h)}">${small ? '' : minis(x.pendA, t)}</div><div class="lbl"><div>${t.now}</div><small>${t.pity}</small></div></div>`;
  const grid = [h / 2, h].map(g => `<div style="bottom:calc(var(--lbl) + ${H(g, h)})"><span>${g}</span></div>`).join('');
  const legend = `<div class="lg"><span><i style="background:var(--s)"></i>${t.featured}</span><span><i style="background:repeating-linear-gradient(135deg,var(--s) 0 2px,var(--s2) 2px 4px)"></i>${t.lost}</span><span><i style="background:var(--a);border-radius:50%"></i>${t.aRank}</span></div>`;
  const st = [[x.rows.length, t.pulls], [x.s.length, 'S']].concat(small ? [] : [[x.aCount, 'A'], [x.avg, t.avg, true]]);
  return `<section class="card ${small ? 'sm' : ''} ${cls}" style="flex:${x.s.length + 2} 1 0">
    <div class="top"><h2>${t.names[x.k]}</h2><div class="st">${st.map(([v, l, pre]) => pre ? `<span>${l} <b>${v}</b></span>` : `<span><b>${v}</b> ${l}</span>`).join('')}</div></div>
    ${small ? '' : `<div class="odds">${t.odds(pct(x.odds.next), pct(x.odds.within10), x.odds.expected)}${x.guaranteed ? t.guar : ''}</div>${legend}`}
    <div class="plot"><div class="grid">${grid}</div>${cols}${now}</div></section>`;
}

function records(all, t) {
  const rows = all.flatMap(x => x.rows), total = rows.length;
  const [S, A, B] = [4, 3, 2].map(r => rows.filter(x => x[2] === r).length);
  const ss = all.flatMap(x => x.s), by = ss.slice().sort((a, b) => a.p - b.p);
  const top = list => Object.entries(list.reduce((o, k) => (o[k] = (o[k] || 0) + 1, o), {})).sort((a, b) => b[1] - a[1])[0];
  const reps = top(ss.map(r => r.item)), month = top(rows.map(r => date(r[3]).slice(0, 7))), day = top(rows.map(r => date(r[3]).slice(0, 10)));
  const line = (k, v) => `<div><span>${k}</span><b>${v}</b></div>`;
  return `<section class="card side"><h2>${t.rec}</h2>
    <div class="ranks"><i style="flex:${S};background:var(--s)"></i><i style="flex:${A};background:var(--a)"></i><i style="flex:${B};background:var(--b)"></i></div>
    <div class="rk"><span><b style="color:var(--s)">${S}</b>S</span><span><b style="color:var(--a)">${A}</b>A</span><span><b style="color:var(--b)">${B}</b>B</span></div>
    <div class="rec">
      ${line(t.sRate, pct(S / total))}${line(t.aRate, pct(A / total))}${line(t.perA, (total / A).toFixed(1))}
      ${line(t.fast, `${nameOf(by[0].item)} · ${by[0].p}`)}
      ${line(t.slow, `${nameOf(by.at(-1).item)} · ${by.at(-1).p}`)}
      ${line(t.most, `${nameOf(reps[0])} ×${reps[1]}`)}
      ${line(t.month, `${month[0]} · ${month[1]}`)}${line(t.day, `${day[0].slice(5)} · ${day[1]}`)}
    </div></section>`;
}

// Quita las miniaturas que no caben en su barra y deja un +n en su lugar.
function fitMinis() {
  for (const bar of document.querySelectorAll('.bar')) {
    const items = [...bar.querySelectorAll('.mini')];
    const room = Math.floor((bar.clientHeight - 19) / 19);
    if (items.length <= room) continue;
    const keep = Math.max(room - 1, 0);
    items.slice(keep).forEach(el => el.remove());
    bar.insertAdjacentHTML('beforeend', `<div class="more">+${items.length - keep}</div>`);
  }
}

function render() {
  const t = TXT[lang], every = BANNERS.map(stats), all = every.filter(x => !x.small), ex = all[0];
  const total = all.reduce((a, x) => a + x.rows.length, 0);
  TIPS.length = 0;
  document.documentElement.lang = lang;
  const pick = ACCOUNTS.length > 1 ? `<select id="acc">${ACCOUNTS.map(u => `<option${u === DATA.uid ? ' selected' : ''}>${esc(u)}</option>`).join('')}</select>` : '';
  const btns = `<div class="btns">${TOKEN ? `<button class="go" id="upd">${t.update}</button>` : ''}<div>${pick}<button id="lang">${t.lang}</button></div></div>`;
  const note = msg ? `<div class="msg">${esc(msg)}</div>` : '';
  if (!every.some(x => x.rows.length)) {
    $('app').innerHTML = `<header><h1>ZZZ Tracker</h1><div style="margin-left:auto"></div>${btns}</header>${note}<div class="card empty">${t.empty}</div>`;
  } else {
    const sTotal = all.reduce((a, x) => a + x.s.length, 0), lost = ex.s.filter(r => r.std).length;
    const first = Math.min(...every.flatMap(x => x.rows.map(r => r[3])));
    const kpis = [[total.toLocaleString(lang), t.pulls], [(total * 160).toLocaleString(lang), t.poly], [sTotal, t.sRank, 's'],
      [ex.avg, t.exAvg], [`${ex.s.length - lost}/${ex.s.length}`, t.fifty], [pct(ex.odds.within10), t.next10]];
    $('app').innerHTML = `<header><div><h1>ZZZ Tracker</h1><div class="sub">${t.since(date(first).slice(0, 10), esc(DATA.uid))}</div></div>
        <div class="kpis">${kpis.map(([v, l, c]) => `<div class="k"><b class="${c || ''}">${v}</b><span>${l}</span></div>`).join('')}</div>
        ${btns}</header>${note}
      <div class="row">${card(ex, t)}${records(all, t)}</div>
      <div class="row">${all.slice(1).concat(every.filter(x => x.small)).map(x => card(x, t)).join('')}</div>`;
    requestAnimationFrame(fitMinis);
  }
  $('lang').onclick = () => {
    lang = lang === 'es' ? 'en' : 'es';
    try { localStorage.setItem('lang', lang); } catch {}
    render();
  };
  if ($('upd')) $('upd').onclick = update;
  if ($('acc')) $('acc').onchange = e => location.href = '/?uid=' + e.target.value;
}

async function update() {
  const t = TXT[lang], btn = $('upd');
  btn.disabled = true;
  btn.textContent = t.updating;
  try {
    const res = await (await fetch('/update', {method: 'POST', headers: {'X-Token': TOKEN}})).json();
    if (res.error) throw new Error(res.error);
    sessionStorage.setItem('msg', t.added(res.added));
    location.href = '/?uid=' + res.uid;
  } catch (e) {
    msg = t.errors[e.message] || t.errors.api;
    render();
  }
}

document.addEventListener('mousemove', e => {
  const el = e.target.closest('[data-tip]'), box = $('tip');
  if (!el) return box.style.display = 'none';
  box.innerHTML = TIPS[el.dataset.tip];
  box.style.display = 'block';
  const r = box.getBoundingClientRect();
  box.style.left = Math.min(e.clientX + 14, innerWidth - r.width - 8) + 'px';
  box.style.top = Math.min(e.clientY + 14, innerHeight - r.height - 8) + 'px';
});
let resizing;
addEventListener('resize', () => { clearTimeout(resizing); resizing = setTimeout(render, 150); });
try { msg = sessionStorage.getItem('msg') || ''; sessionStorage.removeItem('msg'); } catch {}
render();
document.fonts.ready.then(render);
Promise.all(['avatars.json', 'weapons.json'].map(f => fetch(ENKA + f).then(r => r.json())))
  .then(([av, w]) => {
    for (const [id, a] of Object.entries(av)) if (a.CircleIcon) IMG[id] = 'https://enka.network' + a.CircleIcon;
    for (const [id, x] of Object.entries(w)) if (x.ImagePath) IMG[id] = 'https://enka.network' + x.ImagePath;
    render();
  })
  .catch(() => {});
